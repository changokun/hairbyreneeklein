# ============================================
# HTTPS Server
# ============================================

# Main domain HTTPS - Commented out for staging
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name hairbyreneeklein.com;
#
#     ssl_certificate /etc/letsencrypt/live/hairbyreneeklein.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/hairbyreneeklein.com/privkey.pem;
#     ssl_trusted_certificate /etc/letsencrypt/live/hairbyreneeklein.com/chain.pem;
#
#     include /etc/nginx/snippets/ssl-params.conf;
#     include /etc/nginx/snippets/security-headers.conf;
#     include /etc/nginx/snippets/gzip.conf;
#     include /etc/nginx/snippets/proxy.conf;
# }

# Staging domain HTTPS with Basic Auth
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hairbyreneeklein.omacaco.com;


    # SSL settings
    #    ssl_protocols TLSv1.2 TLSv1.3;
    #    ssl_prefer_server_ciphers on;
    #    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    #    ssl_session_timeout 1d;
    #    ssl_session_cache shared:SSL:50m;
    #    ssl_stapling on;
    #    ssl_stapling_verify on;

    # Basic Authentication
    auth_basic "Staging - Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self'" always;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy to Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
    }

    # Static files
    location /_next/static {
        proxy_pass http://nextjs;
	#        proxy_cache STATIC;
	#        proxy_cache_valid 200 1y;
	#        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Images and other static assets
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff2|woff|ttf|otf|css|js)$ {
        proxy_pass http://nextjs;
	#        proxy_cache STATIC;
	#        proxy_cache_valid 200 1y;
	#        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Health check
    location /health {
        proxy_pass http://nextjs;
    }

    ssl_certificate /etc/letsencrypt/live/hairbyreneeklein.omacaco.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hairbyreneeklein.omacaco.com/privkey.pem; # managed by Certbot
}

# ============================================
# Setup Notes:
# ============================================
# 1. Create htpasswd file for basic auth:
#    sudo sh -c "echo -n 'alex:' >> /etc/nginx/.htpasswd"
#    sudo sh -c "openssl passwd -apr1 >> /etc/nginx/.htpasswd"  (enter 'alex' when prompted)
#    OR use: htpasswd -c /etc/nginx/.htpasswd alex
#
# 2. For self-signed SSL certs (for staging):
#    sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#      -keyout /etc/ssl/private/selfsigned.key \
#      -out /etc/ssl/certs/selfsigned.crt
#
# 3. To activate production domain, uncomment the hairbyreneeklein.com
#    server blocks and get real SSL certs with certbot.